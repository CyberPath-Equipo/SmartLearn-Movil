name: 🔧 Fix Copilot Push
on:
  workflow_run:
    workflows: ["Copilot coding agent"]
    types: [completed]

jobs:
  fix-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: UI-refactor
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🚀 Auto-fix: Nueva branch + PR
        run: |
          BRANCH="copilot-fix-$(date +%s)"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git checkout -b "$BRANCH"
          git add .
          git commit -m "🤖 Copilot UI-refactor fixes" || echo "No changes"
          
          git push -u origin "$BRANCH"
          
          # Crear PR
          gh pr create \
            --title "🤖 Copilot: UI-Refactor Updates" \
            --body "Automated fixes from Copilot agent

Ready for review!" \
            --base UI-refactor \
            --head "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
