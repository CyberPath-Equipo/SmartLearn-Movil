- name: Create new branch and open PR
  run: |
    BRANCH="copilot/update-$(date +%s)"
    git checkout -b "$BRANCH"
    git push origin "$BRANCH"
    
    # Crear Pull Request automáticamente
    curl -s -X POST \
      -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
      -H "Accept: application/vnd.github+json" \
      -d '{
        "title": "🤖 Automated: UI-refactor updates from Copilot",
        "head": "'"$BRANCH"'",
        "base": "UI-refactor",
        "body": "Cambios automáticos generados por Copilot en la rama UI-refactor.\n\nEste PR fue creado automáticamente porque la rama principal está protegida."
      }' \
      "https://api.github.com/repos/${{ github.repository }}/pulls"
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
